const store = JSON.parse(localStorage.getItem(KEY) || '{}');
let filter = 'all';

function save(){ localStorage.setItem(KEY, JSON.stringify(store)); }

function renderBlock(b){
  if (b.t === 'c'){
    const pre = document.createElement('pre');
    const code = document.createElement('code');
    code.textContent = b.v;
    pre.appendChild(code);
    return pre;
  }
  if (b.t === 'l'){
    const ul = document.createElement('ul');
    (b.v || []).forEach(function(item){
      const li = document.createElement('li');
      li.innerHTML = item;
      ul.appendChild(li);
    });
    return ul;
  }
  const p = document.createElement('p');
  p.innerHTML = b.v;
  return p;
}

function render(){
  const list = document.getElementById('list');
  list.innerHTML = '';
  let shown = 0, okCount = 0;

  DATA.forEach(function(q){
    const ok = store[q.n] === 'ok';
    if (ok) okCount++;
    if (filter === 'todo' && ok) return;
    shown++;

    const card = document.createElement('div');
    card.className = 'card' + (ok ? ' ok' : '');

    const head = document.createElement('div');
    head.className = 'head';
    const num = document.createElement('div');
    num.className = 'num'; num.textContent = q.n;
    const tag = document.createElement('span');
    tag.className = 'tag'; tag.textContent = q.tag;
    const topic = document.createElement('span');
    topic.className = 'topic'; topic.textContent = q.topic;
    head.appendChild(num); head.appendChild(tag); head.appendChild(topic);
    card.appendChild(head);

    q.body.forEach(function(b){ card.appendChild(renderBlock(b)); });

    const ans = document.createElement('div');
    ans.className = 'ans';
    const lbl = document.createElement('div');
    lbl.className = 'lbl'; lbl.textContent = '答 案';
    ans.appendChild(lbl);
    q.ans.forEach(function(b){ ans.appendChild(renderBlock(b)); });
    card.appendChild(ans);

    const acts = document.createElement('div');
    acts.className = 'acts';

    const reveal = document.createElement('button');
    reveal.className = 'reveal';
    reveal.textContent = '看答案';
    reveal.onclick = function(){
      const open = ans.classList.toggle('show');
      reveal.textContent = open ? '收起答案' : '看答案';
    };

    const mark = document.createElement('button');
    mark.className = 'mark';
    mark.textContent = ok ? '已掌握 ✓' : '再看';
    mark.onclick = function(){
      if (store[q.n] === 'ok'){ delete store[q.n]; } else { store[q.n] = 'ok'; }
      save(); render();
    };

    acts.appendChild(reveal);
    acts.appendChild(mark);
    card.appendChild(acts);

    list.appendChild(card);
  });

  document.getElementById('prog').style.width = (okCount / DATA.length * 100) + '%';
  document.getElementById('f-all').textContent = '全部 ' + DATA.length + ' 题';
  document.getElementById('f-todo').textContent = '只看没掌握的 (' + (DATA.length - okCount) + ')';
  if (shown === 0){
    const p = document.createElement('p');
    p.className = 'hint';
    p.innerHTML = '📗 全部掌握了。要不要点「重置标记」再来一轮？';
    list.appendChild(p);
  }
}

document.getElementById('f-all').onclick = function(){ filter = 'all'; this.classList.add('on');
  document.getElementById('f-todo').classList.remove('on'); render(); };
document.getElementById('f-todo').onclick = function(){ filter = 'todo'; this.classList.add('on');
  document.getElementById('f-all').classList.remove('on'); render(); };
document.getElementById('f-reset').onclick = function(){
  if (confirm('清空所有掌握标记？')){ for (const k in store) delete store[k]; save(); render(); }
};

render();
</script>
